name: Market update and Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '45 8 * * 1-5'
    - cron: '5 23 * * 0-4'
permissions:
  contents: read
concurrency:
  group: katestock-market-update
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install 'akshare==1.17.86'
      - run: npm ci
      - run: python scripts/ingest.py
      - run: node --experimental-strip-types scripts/generate_signals.mjs
      - run: python scripts/ai_brief.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - run: python -m unittest discover -s tests
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run build
      - run: python scripts/check_public.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
